<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/6min.css" | relURL }}">
  <script>
    (function () {
      try {
        var k = "sixmin-theme";
        var root = document.documentElement;
        var s = localStorage.getItem(k);
        var d = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (s === "dark" || (!s && d)) {
          root.classList.add("sixmin-dark");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased sixmin-dark:bg-slate-950 sixmin-dark:text-slate-100">
  <div class="mx-auto max-w-3xl px-6 py-10">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">{{ .Title }}</h1>
        {{ with .Content }}<div class="prose prose-slate max-w-none mt-2 sixmin-dark:prose-invert">{{ . }}</div>{{ end }}
      </div>
      <button type="button" data-sixmin-toggle
        class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm shadow-sm transition hover:bg-slate-100 sixmin-dark:border-slate-700 sixmin-dark:bg-slate-800 sixmin-dark:hover:bg-slate-700">
        <span class="inline sixmin-dark:hidden">🌙 Dark</span>
        <span class="hidden sixmin-dark:inline">☀️ Light</span>
      </button>
    </header>

    <ul class="space-y-3">
      {{ range .Pages.ByDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}"
           class="block rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-slate-300 hover:shadow sixmin-dark:border-slate-800 sixmin-dark:bg-slate-900 sixmin-dark:hover:border-slate-600">
          <h2 class="text-base font-semibold">{{ .Title }}</h2>
          {{ with .Date }}<time class="mt-1 block text-sm text-slate-500 sixmin-dark:text-slate-400" datetime="{{ .Format "2006-01-02" }}">{{ .Format "2 January 2006" }}</time>{{ end }}
        </a>
      </li>
      {{ else }}
      <li class="text-slate-500 sixmin-dark:text-slate-400">还没有内容。</li>
      {{ end }}
    </ul>
  </div>

  <script>
    (function () {
      document.addEventListener("click", function (e) {
        var t = e.target.closest("[data-sixmin-toggle]");
        if (!t) return;
        var isDark = document.documentElement.classList.toggle("sixmin-dark");
        try { localStorage.setItem("sixmin-theme", isDark ? "dark" : "light"); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
